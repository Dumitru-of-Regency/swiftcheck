<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftCheck · Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:0; background:#020617; color:#f1f5f9;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
.container { max-width:900px; margin:0 auto; padding:24px 20px 60px; }
header { padding:16px 0 24px; border-bottom:1px solid #1e293b; margin-bottom:24px; text-align: center; }
.logo-text { font-size: 28px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; }
.logo-regency { color: #F58C1F; }
.logo-facades { color: #8E8E8E; display: block; font-size: 24px; }
.card { background:#1e293b; padding:20px; border-radius:14px; margin-bottom:20px; border:1px solid #293548; }
.card h2 { margin:0 0 16px; font-size:16px; color:#f1f5f9; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.form-group { display:flex; flex-direction:column; }
.form-group.full { grid-column: 1 / -1; }
label { font-size:12px; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; font-weight:600; }
input, select { padding:12px 14px; border-radius:8px; border:1px solid #334155;
background:#0f172a; color:#fff; font-size:14px; outline:none; font-family:inherit; }
input:focus, select:focus { border-color:#4f46e5; }
button { padding:12px 24px; border-radius:8px; border:none; font-weight:600;
cursor:pointer; color:#fff; font-size:14px; font-family:inherit; }
.btn-primary { background:#4f46e5; }
.btn-primary:hover { background:#4338ca; }
.btn-secondary { background:#64748b; }
.btn-danger { background:#dc2626; }
.btn-small { padding:8px 14px; font-size:12px; }
.btn-group { display:flex; gap:10px; }
.operative-list { margin-top:20px; }
.operative-item { background:#0f172a; padding:16px; border-radius:10px; margin-bottom:10px;
display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.operative-info { flex:1; min-width:200px; }
.operative-name { font-size:16px; font-weight:700; color:#f1f5f9; }
.operative-details { font-size:12px; color:#94a3b8; margin-top:4px; }
.operative-company { color:#f59e0b; font-weight: 600; }
.operative-actions { display:flex; gap:8px; }
.empty { padding:40px; text-align:center; color:#64748b; }
.status-msg { padding:12px; border-radius:8px; margin-bottom:16px; text-align:center; font-weight:600; }
.status-success { background:#064e3b; color:#6ee7b7; }
.status-error { background:#7f1d1d; color:#fca5a5; }
@media (max-width:600px) {
.form-grid { grid-template-columns:1fr; }
}
.footer { text-align:center; font-size:11px; color:#475569; margin-top:24px; padding: 10px 0; border-top: 1px solid #1e293b; }
.site-badge { display:inline-block; background:#4f46e5; color:#fff; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:600; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo-text">
<span class="logo-regency">REGENCY</span>
<span class="logo-facades">FACADES</span>
</div>
<div class="site-badge">Site ID: <span id="site-id-display">I</span></div>
</header>

<div id="status-msg"></div>

<div class="card">
<h2 id="form-title">Add New Operative</h2>
<form id="operative-form">
<input type="hidden" id="operative-id">
<div class="form-grid">
<div class="form-group">
<label>Operative Name *</label>
<input type="text" id="name" required placeholder="John Smith">
</div>
<div class="form-group">
<label>Company / Employer *</label>
<input type="text" id="company" required placeholder="ABC Construction Ltd">
</div>
<div class="form-group">
<label>Role / Job Title</label>
<input type="text" id="role" placeholder="Electrician">
</div>
<div class="form-group">
<label>Safety Qualification</label>
<input type="text" id="safety" placeholder="CSCS Card, SSSTS, etc.">
</div>
<div class="form-group">
<label>NFC Tag ID *</label>
<input type="text" id="nfc-tag" required placeholder="Tap card to read or type manually">
<button type="button" class="btn-secondary btn-small" style="margin-top:8px;" onclick="readNfcTag()">📡 Read NFC Tag</button>
</div>
<div class="form-group">
<label>QR Code (optional)</label>
<input type="text" id="qr-code" placeholder="Leave blank if using NFC only">
</div>
<div class="form-group full">
<label>Phone Number (optional)</label>
<input type="text" id="phone" placeholder="+44 7XXX XXXXXX">
</div>
<div class="form-group full">
<label>Notes (optional)</label>
<input type="text" id="notes" placeholder="Any additional info">
</div>
</div>
<div class="btn-group">
<button type="submit" class="btn-primary">💾 Save Operative</button>
<button type="button" class="btn-secondary" onclick="resetForm()">Cancel</button>
</div>
</form>
</div>

<div class="card">
<h2>Registered Operatives (<span id="operative-count">0</span>)</h2>
<div id="operative-list" class="operative-list">
<div class="empty">Loading operatives...</div>
</div>
</div>

<div class="footer">Regency Facades © 2026</div>
</div>

<script>
// ========== SITE CONFIGURATION ==========
const SITE_ID = "I"; // Change to "II", "III", etc. for other sites
// =========================================

document.getElementById('site-id-display').textContent = SITE_ID;

const firebaseConfig = {
apiKey: "AIzaSyAmjVu2bWDLIGZlyN4tEyg0pyIyKbz-g2E",
authDomain: "swiftcheck-ed24e.firebaseapp.com",
databaseURL: "https://swiftcheck-ed24e-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "swiftcheck-ed24e",
storageBucket: "swiftcheck-ed24e.firebasestorage.app",
messagingSenderId: "918610814261",
appId: "1:918610814261:web:175b912556afc0d82e587c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const operativesRef = db.ref('sites/' + SITE_ID + '/operatives');

const form = document.getElementById('operative-form');
const operativeList = document.getElementById('operative-list');
const statusMsg = document.getElementById('status-msg');
let operatives = {};

function showStatus(msg, type) {
statusMsg.textContent = msg;
statusMsg.className = 'status-msg status-' + type;
setTimeout(() => { statusMsg.textContent = ''; statusMsg.className = ''; }, 3000);
}

function resetForm() {
form.reset();
document.getElementById('operative-id').value = '';
document.getElementById('form-title').textContent = 'Add New Operative';
}

async function readNfcTag() {
if (!('NDEFReader' in window)) {
alert('NFC not supported on this device/browser. Use Android Chrome.');
return;
}
try {
const reader = new NDEFReader();
reader.onreading = (event) => {
let tagId = '';
if (event.message && event.message.records) {
for (const rec of event.message.records) {
if (rec.recordType === 'text' || rec.recordType === 'url') {
tagId = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data).trim();
break;
}
}
}
if (!tagId && event.serialNumber) tagId = 'NFC-' + event.serialNumber;
if (tagId) {
document.getElementById('nfc-tag').value = tagId;
showStatus('NFC tag read: ' + tagId, 'success');
}
};
await reader.scan();
showStatus('NFC scanner active — tap a card', 'success');
} catch (err) {
alert('NFC error: ' + err.message);
}
}

form.addEventListener('submit', async (e) => {
e.preventDefault();
const id = document.getElementById('operative-id').value;
const operative = {
name: document.getElementById('name').value.trim(),
company: document.getElementById('company').value.trim(),
role: document.getElementById('role').value.trim(),
safetyQual: document.getElementById('safety').value.trim(),
nfcTag: document.getElementById('nfc-tag').value.trim(),
qrCode: document.getElementById('qr-code').value.trim(),
phone: document.getElementById('phone').value.trim(),
notes: document.getElementById('notes').value.trim(),
active: true,
createdAt: id ? operatives[id].createdAt : firebase.database.ServerValue.TIMESTAMP,
updatedAt: firebase.database.ServerValue.TIMESTAMP
};

try {
if (id) {
await operativesRef.child(id).update(operative);
showStatus('Operative updated ✓', 'success');
} else {
await operativesRef.push(operative);
showStatus('Operative added ✓', 'success');
}
resetForm();
} catch (err) {
showStatus('Error: ' + err.message, 'error');
}
});

function editOperative(id) {
const o = operatives[id];
document.getElementById('operative-id').value = id;
document.getElementById('name').value = o.name || '';
document.getElementById('company').value = o.company || '';
document.getElementById('role').value = o.role || '';
document.getElementById('safety').value = o.safetyQual || '';
document.getElementById('nfc-tag').value = o.nfcTag || '';
document.getElementById('qr-code').value = o.qrCode || '';
document.getElementById('phone').value = o.phone || '';
document.getElementById('notes').value = o.notes || '';
document.getElementById('form-title').textContent = 'Edit Operative';
window.scrollTo(0, 0);
}

async function deleteOperative(id) {
if (!confirm('Delete this operative? This cannot be undone.')) return;
try {
await operativesRef.child(id).remove();
showStatus('Operative deleted ✓', 'success');
} catch (err) {
showStatus('Error: ' + err.message, 'error');
}
}

function renderOperatives() {
const list = Object.entries(operatives).map(([id, o]) => ({ id, ...o }));
document.getElementById('operative-count').textContent = list.length;

if (list.length === 0) {
operativeList.innerHTML = '<div class="empty">No operatives registered yet. Add your first operative above.</div>';
return;
}

list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

operativeList.innerHTML = list.map(o => `
<div class="operative-item">
<div class="operative-info">
<div class="operative-name">${o.name || 'Unnamed'}</div>
<div class="operative-details">
${o.company ? `<span class="operative-company">${o.company}</span> · ` : ''}
${o.role || 'No role'}
${o.safetyQual ? ` · 🛡️ ${o.safetyQual}` : ''}
<br/>NFC: <code>${o.nfcTag || '—'}</code>
${o.phone ? ` · 📞 ${o.phone}` : ''}
</div>
</div>
<div class="operative-actions">
<button class="btn-primary btn-small" onclick="editOperative('${o.id}')">️ Edit</button>
<button class="btn-danger btn-small" onclick="deleteOperative('${o.id}')">🗑 Delete</button>
</div>
</div>
`).join('');
}

operativesRef.on('value', snap => {
operatives = {};
snap.forEach(child => { operatives[child.key] = child.val(); });
renderOperatives();
});
</script>
</body>
</html>
